<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7">
<title>BCTS</title>
<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --text: #111827;
    --muted: #5b6472;
    --line: #d9dee5;
    --found: #15803d;
    --warn: #b45309;
    --touch: 56px;
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
    font-size: 18px;
    color: var(--text);
    background: var(--bg);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding-bottom: calc(var(--touch) + 24px + env(safe-area-inset-bottom, 0px)); }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  .num { font-variant-numeric: tabular-nums lining-nums; letter-spacing: 0.02em; }

  button {
    min-height: var(--touch);
    font: inherit;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    padding: 0 18px;
    cursor: pointer;
  }
  button.primary { background: var(--text); color: #fff; border-color: var(--text); width: 100%; font-weight: 600; }

  textarea {
    width: 100%;
    min-height: 120px;
    font: inherit;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    resize: vertical;
  }
  .add-form { display: grid; gap: 12px; }
  .feedback { min-height: 1.5em; margin: 12px 0 0; color: var(--muted); }
  .feedback.has-rejected { color: var(--warn); }

  .watchlist { list-style: none; margin: 24px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .watchlist li {
    display: grid; grid-template-columns: 1fr auto; gap: 8px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .entry-number { grid-column: 1 / -1; font-size: 1.5rem; font-weight: 600; }
  .entry-kind { display: block; font-size: 0.85rem; font-weight: 400; color: var(--muted); }
  .watchlist li.found .entry-digits { color: var(--found); text-decoration: line-through; }
  .watchlist li.found .entry-kind { color: var(--found); }

  .empty { color: var(--muted); margin-top: 32px; text-align: center; }
  .list-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; color: var(--muted); }
  button.confirming { border-color: var(--warn); color: var(--warn); }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--line);
  }
  nav button { border: none; background: none; color: var(--muted); }
  nav button[aria-current="page"] { color: var(--text); font-weight: 700; background: var(--bg); }
</style>
</head>
<body>
<main>
  <section id="view-daftar" data-view="daftar">
    <h1>Bagasi yang dicari</h1>
    <form class="add-form" id="add-form">
      <textarea id="bulk-input" placeholder="Tempel nomor tag di sini. Boleh banyak sekaligus." aria-label="Nomor tag bagasi"></textarea>
      <button type="submit" class="primary">Tambah ke daftar</button>
    </form>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <p class="empty" id="empty-state">Tempel nomor bagasi yang dicari untuk mulai.</p>
    <ul class="watchlist" id="watchlist" hidden></ul>
    <div class="list-footer" id="list-footer" hidden>
      <span id="list-count"></span>
      <button type="button" id="clear-all">Hapus semua</button>
    </div>
  </section>

  <section id="view-scan" data-view="scan" hidden>
    <h1>Scan</h1>
    <p class="empty">Pemindai kamera belum tersedia di versi ini.</p>
  </section>

  <section id="view-log" data-view="log" hidden>
    <h1>Log</h1>
    <p class="empty">Hasil scan akan muncul di sini.</p>
  </section>
</main>

<nav aria-label="Navigasi utama">
  <button type="button" data-nav="daftar" aria-current="page">Daftar</button>
  <button type="button" data-nav="scan">Scan</button>
  <button type="button" data-nav="log">Log</button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
