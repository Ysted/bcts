<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BCTS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BCTS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <section id="view-daftar" data-view="daftar">
    <h1>Bagasi yang dicari</h1>
    <form class="add-form" id="add-form">
      <textarea id="bulk-input" placeholder="Tempel nomor tag di sini. Boleh banyak sekaligus." aria-label="Nomor tag bagasi"></textarea>
      <button type="submit" class="primary">Tambah ke daftar</button>
    </form>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <p class="empty" id="empty-state">Tempel nomor bagasi yang dicari untuk mulai.</p>
    <ul class="rows watchlist" id="watchlist" hidden></ul>
    <div class="list-footer" id="list-footer" hidden>
      <span id="list-count"></span>
      <button type="button" id="clear-all">Hapus semua</button>
    </div>
  </section>

  <section id="view-scan" data-view="scan" hidden>
    <h1>Scan</h1>
    <p id="scan-summary"></p>
    <div class="stack">
      <button type="button" class="primary" id="start-scan">Mulai scan</button>
      <button type="button" id="manual-open-idle">Ketik nomor</button>
    </div>
    <p class="feedback" id="scan-feedback" role="status" aria-live="polite"></p>
    <p class="error" id="scan-error" role="alert"></p>
    <p class="muted small"><span id="app-version"></span> <span id="engine-info"></span></p>
  </section>

  <section id="view-log" data-view="log" hidden>
    <h1>Log</h1>
    <p class="empty" id="log-empty">Hasil scan akan muncul di sini.</p>
    <ul class="rows log" id="log-list" hidden></ul>
    <div class="list-footer" id="log-footer" hidden>
      <button type="button" id="copy-log">Salin log</button>
      <button type="button" id="clear-log">Hapus log</button>
    </div>
    <p class="feedback" id="log-feedback" role="status" aria-live="polite"></p>
  </section>
</main>

<nav aria-label="Navigasi utama">
  <button type="button" data-nav="daftar" aria-current="page">Daftar</button>
  <button type="button" data-nav="scan">Scan</button>
  <button type="button" data-nav="log">Log</button>
</nav>

<div class="scanner" id="scanner" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="scan-guide"></div>
  <div class="scan-status" id="scan-status" aria-live="polite">Arahkan kamera ke barcode tag</div>
  <div class="scan-controls">
    <button type="button" id="torch" aria-pressed="false" hidden>Senter</button>
    <button type="button" id="manual-open">Ketik nomor</button>
    <button type="button" class="wide" id="stop-scan">Berhenti scan</button>
  </div>
</div>

<div class="result" id="result" role="alertdialog" aria-modal="true" aria-labelledby="result-title" hidden>
  <p class="result-title" id="result-title"></p>
  <div id="result-body"></div>
  <p class="result-note" id="result-note"></p>
  <div class="result-actions">
    <button type="button" class="primary" id="result-found">Tandai sudah ketemu</button>
    <button type="button" id="result-continue">Lanjut scan</button>
  </div>
</div>

<div class="keypad" id="keypad" role="dialog" aria-modal="true" aria-label="Ketik nomor tag" hidden>
  <p class="keypad-display num" id="keypad-display"></p>
  <p class="keypad-hint" id="keypad-hint">Ketik 10 digit, atau 6 digit nomor seri</p>
  <div class="keys" id="keys">
    <button type="button" data-key="1">1</button>
    <button type="button" data-key="2">2</button>
    <button type="button" data-key="3">3</button>
    <button type="button" data-key="4">4</button>
    <button type="button" data-key="5">5</button>
    <button type="button" data-key="6">6</button>
    <button type="button" data-key="7">7</button>
    <button type="button" data-key="8">8</button>
    <button type="button" data-key="9">9</button>
    <button type="button" data-key="back" aria-label="Hapus satu digit">⌫</button>
    <button type="button" data-key="0">0</button>
    <button type="button" class="primary" data-key="check" id="keypad-check" disabled>Cek</button>
    <button type="button" data-key="close" style="grid-column: 1 / -1">Batal</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
