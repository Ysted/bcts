<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BCTS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BCTS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <section id="view-daftar" data-view="daftar">
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <p class="empty" id="empty-state">Tekan + untuk menambah nomor bagasi yang dicari.</p>
    <div class="list-head" id="list-head" hidden>
      <span id="list-count"></span>
      <span class="list-actions">
        <button type="button" id="select-cancel" hidden>Batal</button>
        <button type="button" id="select-action">Pilih semua</button>
      </span>
    </div>
    <ul class="rows watchlist" id="watchlist" hidden></ul>
    <button type="button" class="fab" id="add-open" aria-label="Tambah nomor bagasi">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
  </section>

  <section id="view-scan" data-view="scan" hidden>
    <div class="scanner" id="scanner">
      <video id="video" playsinline muted autoplay></video>
      <div class="scan-flash" id="scan-flash"></div>
      <div class="scan-layer">
        <div class="scan-count">
          <span id="scan-count"></span>
          <span class="scan-actions">
            <button type="button" id="reset-count">Hitung ulang</button>
            <button type="button" class="round" id="torch" aria-pressed="false" aria-label="Senter" hidden><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M7 3h10v3l-2.5 4v10a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1V10L7 6z M7 6h10 M12 13v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </span>
        </div>
        <div class="scan-guide"></div>
        <div class="scan-result" id="scan-result" aria-live="polite">
          <p class="scan-hint" id="scan-hint"></p>
          <ol class="scan-history" id="scan-history"></ol>
        </div>
        <div class="scan-controls">
          <button type="button" id="scan-retry" hidden>Coba lagi</button>
        </div>
      </div>
    </div>
  </section>

  <section id="view-log" data-view="log" hidden>
    <p class="empty" id="log-empty">Hasil scan akan muncul di sini.</p>
    <div class="list-head" id="log-actions" hidden>
      <button type="button" id="copy-log">Salin log</button>
      <button type="button" id="clear-log">Hapus log</button>
    </div>
    <p class="feedback" id="log-feedback" role="status" aria-live="polite"></p>
    <ul class="rows log" id="log-list" hidden></ul>
  </section>
</main>

<nav aria-label="Navigasi utama">
  <button type="button" data-nav="daftar" aria-current="page">Daftar</button>
  <button type="button" data-nav="scan">Scan</button>
  <button type="button" data-nav="log">Log</button>
</nav>

<div class="result" id="result" role="alertdialog" aria-modal="true" aria-labelledby="result-title" hidden>
  <p class="result-title" id="result-title"></p>
  <div id="result-body"></div>
  <p class="result-note" id="result-note"></p>
  <div class="result-actions">
    <button type="button" class="primary" id="result-found">Tandai sudah ketemu</button>
    <button type="button" id="result-continue">Lanjut scan</button>
  </div>
</div>

<dialog class="add-dialog" id="add-dialog" aria-label="Tambah nomor bagasi">
  <form class="add-form" id="add-form">
    <div class="input-wrap">
      <input id="bulk-input" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done"
        placeholder="Nomor bagasi yang akan dicari" aria-label="Nomor bagasi yang akan dicari">
      <button type="button" id="paste" aria-label="Paste"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 4h6v3H9zM8 5.5H6.5A1.5 1.5 0 0 0 5 7v12.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V7a1.5 1.5 0 0 0-1.5-1.5H16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
    </div>
    <p class="feedback warning" id="add-feedback" role="status" aria-live="polite"></p>
    <button type="submit" class="primary">Tambah ke daftar</button>
  </form>
</dialog>

<dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-text">
  <p id="confirm-text"></p>
  <div class="confirm-actions">
    <button type="button" id="confirm-cancel">Batal</button>
    <button type="button" class="danger" id="confirm-ok">Hapus</button>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
